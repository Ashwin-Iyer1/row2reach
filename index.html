<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Row 2 Reach</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="app-header">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true"></div>
          <h1>Row 2 Reach</h1>
        </div>
      </header>
      <section class="file-input card">
        <div class="input-row">
          <input type="file" id="csv-input" name="csv-input" accept=".csv" />
          <div class="helper">Drop a CSV file here or click to browse.</div>
        </div>
        <div id="table-container"></div>
        <center style="padding-top: 20px">
          <input type="file" id="merge-csv-input" accept=".csv" style="display: none" />
          <button id="download-csv-button" class="btn" style="display: none">
            Download CSV
          </button>
          <button id="merge-csv-button" class="btn" style="display: none; background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 10px 24px rgba(245, 158, 11, 0.34);">
            Attach emails from another CSV
          </button>
          <button id="email-users-button" class="btn" style="display: none">
            Email Users
          </button>
        </center>
      </section>

      <section class="buttons">
        <div class="button-group card">
          <button id="apollo-button" class="btn">Fetch Apollo</button>
          <span id="apollo-data"></span>
        </div>
        <div class="button-group card">
          <button id="zero-bounce-button" class="btn">Fetch Zero Bounce</button>
          <span id="zero-bounce-data"></span>
        </div>
      </section>
      <div class="button-group card" style="margin-bottom: 20px">
        <button id="fetch-all-button" class="btn">Fetch All</button>
      </div>
      <p>Made with love by Ashwin Iyer</p>

      <!-- Update Status Modal -->
      <div id="update-modal" class="modal" style="display: none">
        <div class="modal-content card">
          <div class="modal-header">
            <h3 id="update-title">Checking for Updates</h3>
            <button id="close-update-modal" class="close-button" title="Close">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <p id="update-message">Please wait...</p>
            <div
              id="update-progress"
              class="progress-bar-container"
              style="display: none"
            >
              <div class="progress-bar"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="file-input.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
