<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Row 2 Reach</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <button
        id="back-arrow-button"
        style="
          width: 20px;
          height: 20px;
          text-align: center;
          align-items: center;
          justify-content: center;
          display: flex;
        "
      >
        &larr;
      </button>
      <header class="app-header">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true"></div>
          <h1>Emails</h1>
        </div>
      </header>
      <div id="table-container"></div>

      <div
        class="emails-container"
        style="display: flex; justify-content: space-between"
      >
        <section class="content">
          <div id="emails-list"></div>
          <form id="emailForm" style="width: 100%">
            <div>
              <label for="subject">Subject:</label>
              <input type="text" id="subject" /><br /><br />
            </div>
            <div>
              <label for="body">Message:</label>
              <label for="body">Message:</label>
              <div class="editor-toolbar">
                <button type="button" id="btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
                <button type="button" id="btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
                <button type="button" id="btn-underline" title="Underline (Ctrl+U)"><u>U</u></button>
                <button type="button" id="btn-link" title="Link (Ctrl+K)">🔗</button>
              </div>
              <div id="body" class="rich-text-editor" contenteditable="true"></div><br /><br />
            </div>
          </form>
          <button id="preview-button" type="submit">Preview</button>
          <button class="dropdown-item btn" id="saveAsCsv">Save as CSV</button>
          <button class="dropdown-item btn" id="signIn">
            Sign in using Popup
          </button>
          <button class="dropdown-item btn" id="useSelenium">
            Send Using Selenium
          </button>
          <button
            class="dropdown-item add-northeastern-bcc-button"
            id="addNortheasternAll"
          >
            Add Northeastern BCCs to All
          </button>
          <button class="dropdown-item" id="draftAll">Draft All</button>
          <button class="dropdown-item" id="sendAll">Send All</button>
          <div id="preview-list"></div>
        </section>
        <section class="variables-section">
          <div class="variables-header" style="text-align: center">
            <h2>Available Variables</h2>
            <div id="variables-list"></div>
          </div>
        </section>
      </div>
      <!-- Selenium Options Modal -->
      <div id="selenium-options-modal" class="modal" style="display: none">
        <div class="modal-content card">
          <div class="modal-header">
            <h3>Selenium Options</h3>
            <button
              id="close-selenium-modal"
              class="close-button"
              title="Close"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <p>Select an action for your email list:</p>
            <div
              class="modal-actions"
              style="
                display: flex;
                gap: 10px;
                justify-content: center;
                margin-top: 20px;
              "
            >
              <button
                id="modal-draft-all"
                class="dropdown-item"
                style="
                  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
                  color: white;
                "
              >
                Draft All
              </button>
              <button
                id="modal-send-all"
                class="dropdown-item"
                style="
                  background: linear-gradient(135deg, #10b981, #059669);
                  color: white;
                "
              >
                Send All
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="file-input.js"></script>
    <script src="emails-buttons.js"></script>
  </body>
</html>
